name: Contribution snake

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake in light and dark themes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7c5ce7&color_dots=#ebedf0,#b8eee4,#78d8c7,#35b8a4,#178574
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ad99ff&color_dots=#161b22,#163c3a,#1d7168,#28a694,#50dec3

      - name: Publish generated SVGs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs/promises');
            const { owner, repo } = context.repo;
            const branch = 'snake-output';
            const files = ['github-snake.svg', 'github-snake-dark.svg'];
            let head;
            let baseTree;
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + branch });
              head = ref.data.object.sha;
              const commit = await github.rest.git.getCommit({ owner, repo, commit_sha: head });
              baseTree = commit.data.tree.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const entries = [];
            for (const path of files) {
              const content = await fs.readFile('dist/' + path, 'utf8');
              if (!content.includes('<svg')) throw new Error('Invalid SVG: ' + path);
              entries.push({ path, mode: '100644', type: 'blob', content });
            }
            const tree = await github.rest.git.createTree({
              owner, repo, ...(baseTree ? { base_tree: baseTree } : {}), tree: entries
            });
            if (tree.data.sha === baseTree) {
              core.info('Contribution animation is already up to date.');
              return;
            }
            const commit = await github.rest.git.createCommit({
              owner, repo, message: 'Update contribution snake animation',
              tree: tree.data.sha, parents: head ? [head] : []
            });
            if (head) {
              await github.rest.git.updateRef({ owner, repo, ref: 'heads/' + branch, sha: commit.data.sha, force: false });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/' + branch, sha: commit.data.sha });
            }
            core.info('Published both contribution animations to ' + branch);
